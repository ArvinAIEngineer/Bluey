<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bluey & Bingo Games!</title>
  <meta name="description"
    content="Play fun 3D backyard games with Bluey and Bingo! Collect biscuits, flowers, and more in this parent-controlled interactive experience.">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://arvinaiengineer.github.io/Bluey/">
  <meta property="og:title" content="Bluey & Bingo's Backyard Games!">
  <meta property="og:description"
    content="Run around the Heeler backyard and complete fun challenges in this 3D fan-made adventure.">
  <meta property="og:image" content="./Image.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://arvinaiengineer.github.io/Bluey/">
  <meta property="twitter:title" content="Bluey & Bingo's Backyard Games!">
  <meta property="twitter:description"
    content="Run around the Heeler backyard and complete fun challenges in this 3D fan-made adventure.">
  <meta property="twitter:image" content="./Image.png">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      overflow-x: hidden;
      touch-action: manipulation;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #5bbfea 0%, #87CEEB 40%, #a8e6ff 100%);
      font-family: 'Nunito', sans-serif;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── CLOUDS ── */
    .cloud {
      position: fixed;
      background: #fff;
      border-radius: 999px;
      opacity: 0.85;
      pointer-events: none;
    }

    .cloud::before,
    .cloud::after {
      content: '';
      position: absolute;
      background: #fff;
      border-radius: 50%;
    }

    /* ── GRASS STRIP ── */
    .grass {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: clamp(50px, 10vw, 90px);
      background: linear-gradient(to bottom, #2d8a20, #1a6010);
      z-index: 0;
    }

    .grass::before {
      content: '';
      position: absolute;
      top: -20px;
      left: 0;
      right: 0;
      height: 30px;
      background: radial-gradient(ellipse 30px 20px at 50% 100%, #2d8a20 50%, transparent 51%);
      background-size: 40px 30px;
      background-repeat: repeat-x;
    }

    /* ── HEADER ── */
    header {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 48px 20px 24px;
    }

    .logo-emoji {
      font-size: 52px;
      display: block;
      margin-bottom: 8px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-10px)
      }
    }

    h1 {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(32px, 8vw, 72px);
      color: #fff;
      -webkit-text-stroke: 3px #2a4a6b;
      text-shadow: 4px 4px 0 #2a4a6b;
      line-height: 1.1;
      margin-bottom: 10px;
    }

    .tagline {
      font-size: clamp(14px, 2.5vw, 18px);
      color: rgba(255, 255, 255, 0.9);
      font-weight: 700;
      text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.2);
    }

    /* ── PICK TEXT ── */
    .pick-label {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(22px, 4vw, 32px);
      color: #fff;
      text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.2);
      margin-bottom: 36px;
      position: relative;
      z-index: 2;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0.7
      }
    }

    /* ── CARDS ── */
    .cards {
      display: flex;
      gap: clamp(14px, 3vw, 48px);
      justify-content: center;
      flex-wrap: wrap;
      padding: 0 16px 100px;
      position: relative;
      z-index: 2;
    }

    .card {
      background: #fff;
      border: 4px solid #2a4a6b;
      border-radius: 28px;
      padding: clamp(20px, 4vw, 36px) clamp(18px, 3.5vw, 32px);
      width: clamp(140px, 42vw, 320px);
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      display: block;
      box-shadow: 6px 6px 0 #2a4a6b;
      transition: transform 0.15s, box-shadow 0.15s;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 24px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .card-bluey {
      background: linear-gradient(160deg, #e8f8ff 0%, #c8eeff 100%);
    }

    .card-bluey::before {
      background: linear-gradient(160deg, #4db8f0 0%, #2a90d0 100%);
    }

    .card-bingo {
      background: linear-gradient(160deg, #fff5e8 0%, #ffe0c0 100%);
    }

    .card-bingo::before {
      background: linear-gradient(160deg, #ff8c42 0%, #ee5500 100%);
    }

    @media (hover: hover) {
      .card:hover {
        transform: translate(-4px, -4px) rotate(-1deg);
        box-shadow: 10px 10px 0 #2a4a6b;
      }

      .card:hover::before {
        opacity: 0.08;
      }
    }

    .card:active {
      transform: translate(2px, 2px) !important;
      box-shadow: 3px 3px 0 #2a4a6b !important;
    }

    .card-avatar {
      width: clamp(90px, 20vw, 150px);
      height: clamp(90px, 20vw, 150px);
      object-fit: contain;
      display: block;
      margin: 0 auto 16px;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.2));
      animation: avatar-bob 2.5s ease-in-out infinite;
      transform-origin: bottom center;
    }

    .card:nth-child(2) .card-avatar {
      animation-delay: 0.4s;
    }

    @keyframes avatar-bob {

      0%,
      100% {
        transform: translateY(0) rotate(0deg)
      }

      33% {
        transform: translateY(-8px) rotate(-2deg)
      }

      66% {
        transform: translateY(-4px) rotate(2deg)
      }
    }

    .card-name {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(22px, 5vw, 36px);
      color: #2a4a6b;
      margin-bottom: 6px;
    }

    .card-bluey .card-name {
      color: #1a78bb;
    }

    .card-bingo .card-name {
      color: #cc4400;
    }

    .card-game {
      font-size: clamp(12px, 2.5vw, 15px);
      color: #666;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .card-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 3px solid currentColor;
      border-radius: 999px;
      padding: 8px 22px;
      font-family: 'Fredoka One', cursive;
      font-size: clamp(14px, 3vw, 17px);
      box-shadow: 3px 3px 0 currentColor;
      transition: transform 0.1s;
    }

    .card-bluey .card-pill {
      color: #1a78bb;
    }

    .card-bingo .card-pill {
      color: #cc4400;
    }

    .card:hover .card-pill {
      transform: scale(1.05);
    }

    /* Stars decoration */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .star {
      position: absolute;
      width: 6px;
      height: 6px;
      background: #fff;
      border-radius: 50%;
      opacity: 0.6;
      animation: twinkle 3s ease-in-out infinite;
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: 0.6;
        transform: scale(1)
      }

      50% {
        opacity: 0.2;
        transform: scale(0.5)
      }
    }

    /* Sun */
    .sun {
      position: fixed;
      top: 40px;
      right: 60px;
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, #FFD93D 60%, rgba(255, 217, 61, 0) 100%);
      border-radius: 50%;
      box-shadow: 0 0 40px 20px rgba(255, 217, 61, 0.4);
      animation: sun-pulse 4s ease-in-out infinite;
      z-index: 1;
    }

    @keyframes sun-pulse {

      0%,
      100% {
        box-shadow: 0 0 40px 20px rgba(255, 217, 61, 0.4)
      }

      50% {
        box-shadow: 0 0 60px 30px rgba(255, 217, 61, 0.3)
      }
    }

    /* Birds */
    .bird {
      position: fixed;
      z-index: 1;
      pointer-events: none;
      font-size: 22px;
      animation: fly linear infinite;
    }

    @keyframes fly {
      from {
        transform: translateX(-80px);
      }

      to {
        transform: translateX(110vw);
      }
    }

    #mute-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 50;
      font-size: 24px;
      background: #fff;
      border: 3px solid #333;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 3px 3px 0 #333;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    #mute-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 #333;
    }

    #mute-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #333;
    }

    /* ── PARENT BUTTON ── */
    #parent-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 50;
      font-family: 'Fredoka One', cursive;
      font-size: 16px;
      background: #fff;
      border: 3px solid #333;
      border-radius: 12px;
      padding: 8px 16px;
      cursor: pointer;
      box-shadow: 3px 3px 0 #333;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    #parent-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 #333;
    }

    #parent-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #333;
    }

    /* ── FOOTER ── */
    footer {
      position: fixed;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      color: #2a2a2a;
      opacity: 0.8;
      z-index: 10;
      pointer-events: none;
    }

    footer b {
      font-family: 'Fredoka One', cursive;
      color: #df4d10;
    }

    /* Splash Screen */
    #splash {
      position: fixed;
      inset: 0;
      background: linear-gradient(160deg, #5bbfea 0%, #87CEEB 40%, #a8e6ff 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.5s ease-out;
    }

    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .start-btn {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(24px, 5vw, 40px);
      color: #fff;
      background: #ff8c42;
      border: 4px solid #2a4a6b;
      border-radius: 999px;
      padding: 16px 40px;
      cursor: pointer;
      box-shadow: 6px 6px 0 #2a4a6b;
      transition: transform 0.1s, box-shadow 0.1s;
      margin-top: 20px;
    }

    .start-btn:hover {
      transform: translate(-4px, -4px);
      box-shadow: 10px 10px 0 #2a4a6b;
    }

    .start-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 3px 3px 0 #2a4a6b;
    }
  </style>
</head>

<body>

  <!-- Background decoration -->
  <div class="sun"></div>
  <div class="stars" id="stars"></div>

  <!-- Floating birds -->
  <div class="bird" style="top:18%;animation-duration:18s;animation-delay:-4s">🐦</div>
  <div class="bird" style="top:12%;animation-duration:24s;animation-delay:-14s;font-size:16px">🐦</div>

  <!-- Clouds (CSS drawn) -->
  <div class="cloud-dec"
    style="position:fixed;top:8%;left:5%;width:120px;height:40px;background:#fff;border-radius:40px;opacity:.8;z-index:1;animation:drift1 20s linear infinite">
  </div>
  <div class="cloud-dec"
    style="position:fixed;top:15%;left:35%;width:90px;height:30px;background:#fff;border-radius:30px;opacity:.7;z-index:1;animation:drift2 25s linear infinite">
  </div>
  <div class="cloud-dec"
    style="position:fixed;top:6%;right:15%;width:110px;height:36px;background:#fff;border-radius:36px;opacity:.75;z-index:1;animation:drift3 30s linear infinite">
  </div>
  <style>
    @keyframes drift1 {
      0% {
        transform: translateX(0)
      }

      100% {
        transform: translateX(30px)
      }
    }

    @keyframes drift2 {
      0% {
        transform: translateX(0)
      }

      100% {
        transform: translateX(-20px)
      }
    }

    @keyframes drift3 {
      0% {
        transform: translateX(0)
      }

      100% {
        transform: translateX(25px)
      }
    }

    @media (max-width: 768px) {
      .cloud-dec {
        display: none !important;
      }
    }
  </style>

  <!-- Grass -->
  <div class="grass"></div>

  <!-- Main content -->
  <header>
    <span class="logo-emoji">🏡</span>
    <h1>Bluey's Backyard!</h1>
    <p class="tagline">Play in the backyard with Bluey and Bingo! 🐾</p>
  </header>

  <div class="pick-label">👇 Who do you want to play as?</div>

  <div class="cards">
    <a class="card card-bluey" href="./bluey.html" ontouchstart="">
      <img class="card-avatar" src="./bluey.png" alt="Bluey">
      <div class="card-name">Bluey</div>
      <div class="card-game">🍪 Biscuit Run</div>
      <div class="card-pill">Play! →</div>
    </a>

    <a class="card card-bingo" href="./bingo.html" ontouchstart="">
      <img class="card-avatar" src="./bingo.png" alt="Bingo" style="animation-delay:0.4s">
      <div class="card-name">Bingo</div>
      <div class="card-game">🌸 Flower Hunt</div>
      <div class="card-pill">Play! →</div>
    </a>
  </div>

  <footer>
    Designed and developed by a Dad of a four year old who is a big fan of Bluey 💙
  </footer>

  <!-- Splash Screen -->
  <div id="splash">
    <span class="logo-emoji" style="font-size: 80px;">🏡</span>
    <h1 style="font-size: clamp(40px, 8vw, 80px);">Welcome!</h1>
    <button class="start-btn" id="start-btn">Enter the Backyard! 🐾</button>
  </div>

  <button id="mute-btn">🔊</button>
  <button id="parent-btn" onclick="openParentMenu()">🔒 Parents</button>

  <!-- Global Music Player -->
  <audio id="bg-music" loop>
    <source src="./bluey.mp3" type="audio/mpeg">
  </audio>

  <script>
    // Global music script
    const bgMusic = document.getElementById('bg-music');
    const muteBtn = document.getElementById('mute-btn');
    const splash = document.getElementById('splash');
    const startBtn = document.getElementById('start-btn');

    // Restore mute state
    let isMuted = localStorage.getItem('blueyMusicMuted') === 'true';
    bgMusic.muted = isMuted;
    muteBtn.textContent = isMuted ? '🔇' : '🔊';

    muteBtn.addEventListener('click', (e) => {
      e.stopPropagation(); // prevent triggering global click play
      isMuted = !isMuted;
      bgMusic.muted = isMuted;
      localStorage.setItem('blueyMusicMuted', isMuted);
      muteBtn.textContent = isMuted ? '🔇' : '🔊';
    });

    // Handle Start button click to initialize audio and hide splash
    startBtn.addEventListener('click', () => {
      bgMusic.play();
      splash.classList.add('hidden');
    });

    // Try to restore playback position
    // We only try to play automatically if we are already playing.
    const savedTime = localStorage.getItem('blueyMusicTime');
    if (savedTime) {
      bgMusic.currentTime = parseFloat(savedTime);
    }

    // Auto-hide splash and attempt play if already interacted on other pages
    if (savedTime) {
      splash.classList.add('hidden');
      const playPromise = bgMusic.play();
      if (playPromise !== undefined) {
        playPromise.catch(error => {
          // If browser still blocks, show splash again
          splash.classList.remove('hidden');
        });
      }
    }

    // Save playback position periodically
    setInterval(() => {
      localStorage.setItem('blueyMusicTime', bgMusic.currentTime);
    }, 1000);

    // Parent Gate Logic
    function openParentMenu() {
      const a = Math.floor(Math.random() * 5) + 3;
      const b = Math.floor(Math.random() * 5) + 3;
      const ans = prompt(`Grown-ups only! What is ${a} × ${b}?`);
      if (ans && parseInt(ans) === a * b) {
        window.location.href = './setup.html';
      } else if (ans !== null) {
        alert("Oops! That's not right.");
      }
    }

    // Sprinkle stars
    const starsEl = document.getElementById('stars');
    for (let i = 0; i < 30; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 70 + '%';
      s.style.animationDelay = Math.random() * 4 + 's';
      s.style.width = s.style.height = (4 + Math.random() * 6) + 'px';
      starsEl.appendChild(s);
    }
  </script>
</body>

</html>
