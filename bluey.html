<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bluey's Biscuit Run!</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800&display=swap');

    :root {
      --blue: #4db8f0;
      --yellow: #FFD93D;
      --white: #FFFEF5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      font-family: 'Nunito', sans-serif;
      background: #87CEEB;
      touch-action: none;
      user-select: none;
    }

    #canvas {
      position: fixed;
      top: 0;
      left: 0;
      display: block;
    }

    #ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    #hud {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
    }

    .pill {
      background: var(--white);
      border: 3px solid #333;
      border-radius: 999px;
      padding: 5px 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 3px 3px 0 #333;
    }

    .pill-icon {
      font-size: clamp(14px, 3vw, 18px);
    }

    .pill-val {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(16px, 3.5vw, 22px);
      color: #333;
      min-width: 24px;
      text-align: center;
    }

    #timer-pill .pill-val {
      color: #e05c2a;
    }

    #timer-pill.urgent {
      animation: tshake .25s infinite;
    }

    @keyframes tshake {

      0%,
      100% {
        transform: rotate(-2deg)
      }

      50% {
        transform: rotate(2deg)
      }
    }

    #popup {
      position: absolute;
      top: 44%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Fredoka One', cursive;
      font-size: clamp(22px, 5vw, 34px);
      color: var(--yellow);
      -webkit-text-stroke: 2px #333;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
    }

    .pop-go {
      animation: popUp .75s ease-out forwards;
    }

    @keyframes popUp {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(.8)
      }

      50% {
        opacity: 1;
        transform: translate(-50%, -100%) scale(1.25)
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -160%) scale(.9)
      }
    }

    /* Keyboard hints — hide on touch, show on desktop */
    #ctrl {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      opacity: .5;
    }

    .crow {
      display: flex;
      gap: 5px;
    }

    .key {
      background: var(--white);
      border: 2px solid #555;
      border-radius: 6px;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Fredoka One', cursive;
      font-size: 12px;
      color: #333;
      box-shadow: 2px 2px 0 #555;
    }

    @media (hover:none) and (pointer:coarse) {
      #ctrl {
        display: none;
      }

      .pill:first-child {
        display: none !important;
      }

      /* Hide score pill on mobile */
    }

    /* Virtual joystick */
    #joystick-zone {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 20;
      pointer-events: all;
      display: none;
    }

    #joystick-outer {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: 3px solid rgba(255, 255, 255, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }

    #joystick-inner {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.75);
      border: 2px solid rgba(0, 0, 0, 0.2);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      pointer-events: none;
      transition: transform 0.05s;
    }

    @media (hover:none) and (pointer:coarse) {
      #joystick-zone {
        display: block;
      }
    }

    #back-btn {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 20;
      font-family: 'Fredoka One', cursive;
      font-size: clamp(12px, 3vw, 14px);
      background: #fff;
      color: #333;
      border: 3px solid #333;
      border-radius: 999px;
      padding: 7px 14px;
      cursor: pointer;
      box-shadow: 3px 3px 0 #333;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: transform 0.1s, box-shadow 0.1s;
      display: flex !important;
    }

    #back-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 #333;
    }

    #screen {
      position: absolute;
      inset: 0;
      background: rgba(77, 184, 240, .88);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: all;
      transition: opacity .3s;
    }

    #screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .card {
      background: var(--white);
      border: 4px solid #333;
      border-radius: 26px;
      padding: clamp(18px, 4vw, 28px) clamp(20px, 5vw, 36px);
      text-align: center;
      box-shadow: 6px 6px 0 #333;
      max-width: 400px;
      width: 90%;
    }

    .card-img {
      width: clamp(80px, 20vw, 120px);
      height: clamp(80px, 20vw, 120px);
      object-fit: contain;
      display: block;
      margin: 0 auto 12px;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.2));
    }

    .card-title {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(24px, 6vw, 34px);
      color: var(--blue);
      -webkit-text-stroke: 1.5px #333;
      line-height: 1.1;
      margin-bottom: 6px;
    }

    .card-sub {
      font-size: clamp(12px, 2.5vw, 14px);
      color: #666;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .card-stats {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(14px, 3vw, 17px);
      color: #444;
      margin-bottom: 16px;
      line-height: 1.9;
    }

    .play-btn {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(16px, 3.5vw, 19px);
      color: #333;
      background: var(--yellow);
      border: 3px solid #333;
      border-radius: 999px;
      padding: 12px 36px;
      cursor: pointer;
      box-shadow: 4px 4px 0 #333;
      transition: transform .1s, box-shadow .1s;
      pointer-events: all;
    }

    .play-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 #333;
    }

    .play-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #333;
    }

    #loading {
      position: fixed;
      inset: 0;
      background: #4ab8e8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 30;
      font-family: 'Fredoka One', cursive;
      color: #333;
      font-size: clamp(15px, 3.5vw, 18px);
    }

    #loading.hidden {
      display: none;
    }

    .lpup {
      width: clamp(90px, 20vw, 130px);
      height: clamp(90px, 20vw, 130px);
      object-fit: contain;
      animation: pup .55s infinite alternate;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.25));
    }

    @keyframes pup {
      from {
        transform: translateY(0)
      }

      to {
        transform: translateY(-14px)
      }
    }

    #mute-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 50;
      font-size: 24px;
      background: #fff;
      border: 3px solid #333;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 3px 3px 0 #333;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    #mute-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 #333;
    }

    #mute-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #333;
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>
  <a id="back-btn" href="./index.html">🏡 Home</a>

  <!-- Virtual joystick (touch only) -->
  <div id="joystick-zone">
    <div id="joystick-outer">
      <div id="joystick-inner"></div>
    </div>
  </div>

  <div id="loading">
    <img class="lpup" src="./bluey.png" alt="Bluey">
    <div>Setting up the backyard...</div>
  </div>

  <div id="ui">
    <div id="hud">
      <div class="pill"><span class="pill-icon">🍪</span><span class="pill-val" id="score-val">0</span></div>
      <div class="pill"><span class="pill-icon">🐾</span><span class="pill-val" id="collect-val">0/12</span></div>
      <div class="pill" id="timer-pill"><span class="pill-icon">⏰</span><span class="pill-val" id="timer-val">60</span>
      </div>

      <div class="crow">
        <div class="key">A</div>
        <div class="key">S</div>
        <div class="key">D</div>
      </div>
    </div>
  </div>

  <div id="screen">
    <div class="card">

      <div class="card-sub" id="s-sub">Run around the backyard and collect all the biscuits before time runs out! 🍪
      </div>
      <div class="card-stats" id="s-stats" style="display:none"></div>
      <button class="play-btn" id="play-btn" onclick="startGame()">Let's Play! 🎉</button>
    </div>
  </div>

  <button id="mute-btn">🔊</button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="./items-lib.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script>
    // READ URL PARAMS
    const params = new URLSearchParams(window.location.search);
    const itmId = params.get('item') || 'biscuit';
    let ITEM_DEF = window.ITEMS[itmId];

    // Final safety: if for some reason the ID is missing, we try a generic builder
    // but the user wants the specific item, so we prioritize the catalog.
    if (!ITEM_DEF) {
      ITEM_DEF = {
        id: itmId,
        name: params.get('label') || itmId,
        emoji: params.get('emoji') || '📦',
        build: window.ITEMS['biscuit'].build // Still need a builder to avoid crash

      document.querySelector('#score-val').previousElementSibling.textContent = ITEM_DEF.emoji;
      document.getElementById('s-title').innerHTML = `Bluey's<br>${ITEM_DEF.name || ITEM_DEF.label} Run!`;
      document.getElementById('s-sub').innerHTML = `Run around the backyard and collect all the ${ITEM_DEF.name || ITEM_DEF.label.toLowerCase()} before time runs out! ${ITEM_DEF.emoji}`;

    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });

    camera.position.set(0, 14, 18); camera.lookAt(0, 0, 0);

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);

      camera.updateProjectionMatrix();

    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const sun = new THREE.DirectionalLight(0xfff5cc, 1.6);
    sun.position.set(12, 25, 10); sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);

    sun.shadow.camera.right = sun.shadow.camera.top = 30;
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0x88bbff, 0.25);
    fill.position.set(-8, 6, -5); scene.add(fill);

    const playerSpot = new THREE.SpotLight(0xffffff, 2.5, 9, Math.PI / 6, 0.4);
    playerSpot.position.set(0, 7, 2); scene.add(playerSpot); scene.add(playerSpot.target);

    const M = {
      grass: new THREE.MeshStandardMaterial({ color: 0x268a18, roughness: 0.9 }),
      grassDark: new THREE.MeshStandardMaterial({ color: 0x145c0a, roughness: 0.9 }),
      fence: new THREE.MeshStandardMaterial({ color: 0xa0622a, roughness: 0.8 }),
      fenceRail: new THREE.MeshStandardMaterial({ color: 0x7a4a1a, roughness: 0.8 }),
      house: new THREE.MeshStandardMaterial({ color: 0xe8a820, roughness: 0.7 }),
      roof: new THREE.MeshStandardMaterial({ color: 0xcc2211, roughness: 0.7 }),
      door: new THREE.MeshStandardMaterial({ color: 0x5a3010, roughness: 0.7 }),
      window: new THREE.MeshStandardMaterial({ color: 0x44aaee, roughness: 0.2, metalness: 0.2 }),
      trampolineLegs: new THREE.MeshStandardMaterial({ color: 0x666666, roughness: 0.5, metalness: 0.6 }),
      trampolineMat: new THREE.MeshStandardMaterial({ color: 0x1133bb, roughness: 0.9 }),
      clothesline: new THREE.MeshStandardMaterial({ color: 0x666666, roughness: 0.5, metalness: 0.6 }),
      wood: new THREE.MeshStandardMaterial({ color: 0x7a4820, roughness: 0.9 }),
      treeTrunk: new THREE.MeshStandardMaterial({ color: 0x5a3a18, roughness: 1.0 }),

    const BOUND = 18, obstacles = [];

    const F = BOUND + 1; fenceSegment(-F, -F, F, -F); fenceSegment(F, -F, F, F); fenceSegment(F, F, -F, F); fenceSegment(-F, F, -F, -F);

    { const hx = -12, hz = -13; box(9, 4, 6, M.house, hx, 2, hz); const r = new THREE.Mesh(new THREE.ConeGeometry(6.5, 3, 4), M.roof); r.position.set(hx, 5.5, hz); r.rotation.y = Math.PI / 4; r.castShadow = true; scene.add(r); box(1.0, 2.0, 0.15, M.door, hx, 1.0, hz + 3.05); box(1.2, 0.9, 0.12, M.window, hx - 2.2, 2.2, hz + 3.05); box(1.2, 0.9, 0.12, M.window, hx + 2.2, 2.2, hz + 3.05); box(3, 0.2, 1, M.path, hx, 0.1, hz + 3.5); addObstacle(hx, hz, 5.5); }
    { const clx = 8, clz = -10; cyl(0.08, 0.08, 4.5, 8, M.clothesline, clx, 2.25, clz); const d = new THREE.Mesh(new THREE.CylinderGeometry(2.8, 2.8, 0.1, 20), M.clothesline); d.position.set(clx, 4.5, clz); scene.add(d); for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2; const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 2.8, 6), M.clothesline); arm.rotation.z = Math.PI / 2; arm.position.set(clx + Math.cos(a) * 1.4, 4.5, clz + Math.sin(a) * 1.4); arm.rotation.y = a; scene.add(arm); const w = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 1.2, 4), M.clothesline); w.position.set(clx + Math.cos(a) * 2.5, 4.0, clz + Math.sin(a) * 2.5); scene.add(w); } cyl(0.3, 0.4, 0.3, 8, M.wood, clx, 0.15, clz); addObstacle(clx, clz, 3.2); }
    { const tx = 9, tz = 8, tramR = 2.8; const ft = new THREE.Mesh(new THREE.TorusGeometry(tramR, 0.18, 8, 40), M.trampolineLegs); ft.position.set(tx, 1.6, tz); ft.rotation.x = Math.PI / 2; ft.castShadow = true; scene.add(ft); const mt = new THREE.Mesh(new THREE.CircleGeometry(tramR - 0.2, 32), M.trampolineMat); mt.position.set(tx, 1.62, tz); mt.rotation.x = -Math.PI / 2; scene.add(mt); for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2; const l = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 1.6, 6), M.trampolineLegs); l.position.set(tx + Math.cos(a) * tramR * 0.9, 0.8, tz + Math.sin(a) * tramR * 0.9); l.castShadow = true; scene.add(l); cyl(0.05, 0.05, 1.8, 6, M.trampolineLegs, tx + Math.cos(a) * (tramR + 0.1), 2.5, tz + Math.sin(a) * (tramR + 0.1)); } addObstacle(tx, tz, tramR + 0.5); }

    function tree(x, z, sc = 1) { cyl(0.22 * sc, 0.3 * sc, 2.0 * sc, 7, M.treeTrunk, x, 1.0 * sc, z); sphere(1.5 * sc, M.treeLeaf, x, 3.2 * sc, z); sphere(1.1 * sc, M.treeLeaf2, x + 0.4 * sc, 4.2 * sc, z + 0.2 * sc); sphere(0.9 * sc, M.treeLeaf, x - 0.3 * sc, 4.6 * sc, z - 0.3 * sc); addObstacle(x, z, 1.0 * sc); }
    tree(-6, -14, 0.85); tree(4, -16, 0.95); tree(14, -12, 0.9); tree(15, 4, 1.0); tree(14, 14, 0.85); tree(-3, 15, 0.9); tree(-13, 12, 0.95); tree(-16, 2, 0.85);

    { const sm = new THREE.MeshStandardMaterial({ color: 0xe8c97a, roughness: 1.0 }); const s = new THREE.Mesh(new THREE.CircleGeometry(2.2, 20), sm); s.rotation.x = -Math.PI / 2; s.position.set(-10, 0.03, 8); scene.add(s); for (let i = 0; i < 8; i++) { const a = (i / 8) * Math.PI * 2; const p = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.25, 0.25), M.wood); p.position.set(-10 + Math.cos(a) * 2.2, 0.15, 8 + Math.sin(a) * 2.2); p.rotation.y = a + Math.PI / 2; scene.add(p); } cyl(0.22, 0.18, 0.35, 8, new THREE.MeshStandardMaterial({ color: 0xff5555 }), -9.5, 0.2, 8.5); cyl(0.04, 0.04, 0.8, 6, new THREE.MeshStandardMaterial({ color: 0x55aaff }), -10.5, 0.4, 7.8, 0.3); addObstacle(-10, 8, 2.6); }

    const collectGroup = new THREE.Group(); scene.add(collectGroup);

    const PARTICLE_GEOM = new THREE.SphereGeometry(0.08, 6, 6);

    function spawnParticles(x, z) {

    joystickOuter.addEventListener('touchstart', e => {
      e.preventDefault();

      joy.dx = 0; joy.dz = 0;
